name: "Build and Deploy to Itch.io"

on:
  push:

permissions:
  contents: write

env:
  GODOT_VERSION: ${{ vars.GODOT_VERSION }}
  EXPORT_NAME: ${{ vars.EXPORT_NAME }}
  # NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` to "."
  # If it's in a subdirectory, set it to the subdirectory name (e.g., "your-game")
  PROJECT_PATH: .

jobs:

  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ vars.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C# project
        run: dotnet build

      - name: Generate .NET bindings
        run: godot --headless --build-solutions --quit || exit 0

      - name: Import project
        run: godot --headless --import || true

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-debug "Windows Desktop" "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"

      - name: Archive Build
        run: |
          cd build/windows
          zip -r ../${EXPORT_NAME}-windows.zip .
          ls -lh ../${EXPORT_NAME}-windows.zip

      - name: Upload to GitHub Release (if this run is a release)
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: build/${{ env.EXPORT_NAME }}-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/${{ env.EXPORT_NAME }}-windows.zip

  export-linux:
    name: Linux Export
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ vars.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C# project
        run: dotnet build

      - name: Generate .NET bindings
        run: godot --headless --build-solutions --quit || exit 0

      - name: Import project
        run: godot --headless --import || true

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-debug "Linux" "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"

      - name: Archive Build
        run: |
          cd build/linux
          zip -r ../${EXPORT_NAME}-linux.zip .
          ls -lh ../${EXPORT_NAME}-linux.zip

      - name: Upload to GitHub Release (if this run is a release)
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: build/${{ env.EXPORT_NAME }}-linux.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/${{ env.EXPORT_NAME }}-linux.zip

  export-mac:
    name: macOS Export
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ vars.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C# project
        run: dotnet build

      - name: Generate .NET bindings
        run: godot --headless --build-solutions --quit || exit 0

      - name: Import project
        run: godot --headless --import || true

      - name: Mac Build
        run: |
          mkdir -v -p build/mac
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-debug "macOS" "$EXPORT_DIR/mac/${EXPORT_NAME}-mac.zip"

      - name: Upload to GitHub Release (if this run is a release)
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: build/mac/${{ env.EXPORT_NAME }}-mac.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac

  deploy-to-itch:
    name: Deploy to Itch.io
    needs: [export-windows, export-linux, export-mac]
    runs-on: ubuntu-24.04
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USERNAME: ${{ vars.ITCH_USERNAME }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Get version from tag or set default
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Upload to Itch.io - Windows
        run: |
          ./butler push builds/windows ${{ env.ITCH_USERNAME }}/${{ env.ITCH_GAME }}:windows --userversion "${{ steps.version.outputs.version }}"

      - name: Upload to Itch.io - Linux
        run: |
          ./butler push builds/linux ${{ env.ITCH_USERNAME }}/${{ env.ITCH_GAME }}:linux --userversion "${{ steps.version.outputs.version }}"

      - name: Upload to Itch.io - macOS
        run: |
          ./butler push builds/mac ${{ env.ITCH_USERNAME }}/${{ env.ITCH_GAME }}:mac --userversion "${{ steps.version.outputs.version }}"
